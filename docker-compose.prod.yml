# ============================================================
# MisMiss — 生产环境部署栈
# ============================================================
# 架构:  Nginx (:18080) → Gunicorn (:8080) → FastAPI
# ============================================================
# 生产模式只拉取镜像（由 CI/CD 发布到 ghcr.io），不在服务器上构建。
# 本地构建测试请使用 docker-compose.yml。
#
# 部署:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
# 更新:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
# 监控:
#   docker compose -f docker-compose.prod.yml logs -f
# ============================================================

services:
  # ================================================================ #
  # MisMiss 应用服务
  # ================================================================ #
  mismiss:
    image: ghcr.io/dikxingmengya/mismiss:latest
    # 未发布到 ghcr.io 时，服务器可改为加载本地镜像（见 BUILDING.md）
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      # 持久化数据（Bot 状态、直播间状态、插件配置等）
      - mismiss_data:/app/data
      # 日志文件
      - mismiss_logs:/app/logs
      # 插件目录
      - mismiss_plugins:/app/plugins
      # 权限配置
      - mismiss_config:/app/config
      # 自定义 config.yml（放置于 config/ 目录）
      - ./config:/app/config:ro
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      - MISMISS_PROD=1
      - API_PORT=8080
      - WORKERS=${MISMISS_WORKERS:-4}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # 资源限制（根据服务器调整）
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # ================================================================ #
  # Nginx 反向代理
  # ================================================================ #
  # 端口说明：
  #   默认 18080 —— 避开 80 端口，留给服务器的统一反向代理（如 Caddy/
  #   Nginx/Traefik）。如需修改：
  #     MISMISS_HTTP_PORT=9090 docker compose -f docker-compose.prod.yml up -d
  #   或在 .env 文件中设置 MISMISS_HTTP_PORT。
  # ================================================================ #
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${MISMISS_HTTP_PORT:-18080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # SSL 证书（可选）
      # - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      mismiss:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  mismiss_data:
  mismiss_logs:
  mismiss_plugins:
  mismiss_config:
