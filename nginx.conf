# ============================================================
# MisMiss — Nginx 生产环境配置
# ============================================================
# 职责：
#   1. 静态文件直接返回（gzip + 长缓存）
#   2. /api/* 反向代理到 Gunicorn
#   3. WebSocket /api/ws 连接升级
#   4. 请求限流 + 安全头
# ============================================================

upstream mismiss_backend {
    server mismiss:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # 上传限制 10MB（插件安装等）
    client_max_body_size 10m;

    # ------------------------------------------------------------------ #
    # 安全头
    # ------------------------------------------------------------------ #
    add_header X-Content-Type-Options  "nosniff"          always;
    add_header X-Frame-Options         "SAMEORIGIN"       always;
    add_header X-XSS-Protection        "1; mode=block"    always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # ------------------------------------------------------------------ #
    # 静态资源 —— 长缓存
    # ------------------------------------------------------------------ #
    location /assets/ {
        proxy_pass http://mismiss_backend;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /favicon.ico {
        proxy_pass http://mismiss_backend;
        expires 7d;
    }

    # ------------------------------------------------------------------ #
    # API —— 后端
    # ------------------------------------------------------------------ #
    location /api/ {
        proxy_pass http://mismiss_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 限流：每分钟 120 个请求，突发 30
        limit_req zone=api burst=30 nodelay;
    }

    # ------------------------------------------------------------------ #
    # WebSocket
    # ------------------------------------------------------------------ #
    location /api/ws {
        proxy_pass http://mismiss_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ------------------------------------------------------------------ #
    # 健康检查 —— 不记录日志
    # ------------------------------------------------------------------ #
    location /api/health {
        proxy_pass http://mismiss_backend;
        access_log off;
    }

    # ------------------------------------------------------------------ #
    # SPA 页面 —— 后端处理（FastAPI 托管 index.html）
    # ------------------------------------------------------------------ #
    location / {
        proxy_pass http://mismiss_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ------------------------------------------------------------------ #
# 限流区域定义
# ------------------------------------------------------------------ #
limit_req_zone $binary_remote_addr zone=api:10m rate=120r/m;
